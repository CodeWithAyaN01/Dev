<!DOCTYPE html>
<html>
<head>
  <title>Program 3 - Object Operations</title>
</head>
<body>
  <h1>JavaScript Program 3</h1>

  <script>

    let student = {
      name: "Rahul",
      grade: 55,
      subjects: ["Math", "Science", "English"],
     displayInfo: function () {
        console.log("Name: " + this.name);
        console.log("Grade: " + this.grade);
        console.log("Subjects: " + this.subjects.join(", "));
      }
    };

    student.displayInfo();
   
    student.pass = student.grade >= 40 ? true : false;
    console.log("Pass status: " + student.pass);
   
    for (let key in student) {
      console.log(key + " : " + student[key]);
    }

  </script>
</body>
</html>
