<!DOCTYPE html>
<html>
<head>
<title>Program 1 - JS Basics & Array Ops</title>
</head>
<body>
<h1>JavaScript Program 1</h1>
<script>
    
    let num1 = 10; 
    let num2 = 20;
    let sum = num1 + num2; 
    alert("The sum is: " + sum);
    
    let cities = ["Bengaluru", "Delhi", "Mumbai", "Chennai", "Hyderabad"];
    
    cities.push("Pune");
    console.log("After adding: " + cities);
    
    cities.shift();
    console.log("After removing first: " + cities);
    
    let index = cities.indexOf("Mumbai"); 
    console.log("Index of Mumbai: " + index);
    
</script>
</body>
</html>
