<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Issue Tracker</title>

    <!-- React and ReactDOM (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX Compilation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/6.26.0/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <!-- React App Code -->
    <script type="text/babel">

        // Issue Data (Static)
        const issues = [
            { id: 1, title: "Bug in login", description: "Users cannot log in", status: "Open" },
            { id: 2, title: "UI Overlap", description: "Button overlaps text", status: "Closed" },
            { id: 3, title: "Performance Issue", description: "Page loads slowly", status: "Open" }
        ];

        // Component to Display Issues
        function IssueList({ issues }) {
            return (
                <div>
                    <h2>Issue Tracker</h2>
                    <ul>
                        {issues.map(issue => (
                            <li key={issue.id}>
                                <strong>ID {issue.id}:</strong> {issue.title} - {issue.description} ({issue.status})
                            </li>
                        ))}
                    </ul>
                </div>
            );
        }

        // Parent Component
        function App() {
            return <IssueList issues={issues} />;
        }

        // Render the App Component
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);

    </script>
</body>
</html>
